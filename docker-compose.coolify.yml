# Coolify: ops dashboard (static nginx).
# Compose path: /docker-compose.coolify.yml
#
# Domain (Coolify): dashboard → container port 80

services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    restart: unless-stopped
    expose:
      - "80"
